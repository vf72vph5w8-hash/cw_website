title: Become A Member
header_image: /assets/uploads/pages/cornwallisletterhead.png
intro_text: >-
  Cornwallis Neighborhood Association (CNA) was formed in 1994. Our main purpose
  was focused to and for the continuous improvement, enhancement,
  beautification, safety, and enjoyment of our neighborhood and all its
  astounding surroundings. Over the years we have beautified our medians,
  purchased, and maintained our unique entrance monument along with the
  flagpole, introduced lights on median 1 and helped residents with their
  respective cul-de-sac median maintenance. Additionally, we operate as needed
  as a neighborhood advocacy group relative to maintaining water quality,
  Environmental health & safety, or other specific matters as they arise.


  # Membership


  Membership dues are currently $20.00 per year. Dues are put towards the following:


  * Entrance Monument maintenance, repair & replacement

  * Flagpole maintenance and Flag replacements

  * Website Costs

  * Printing & Distribution Costs

  * Advertisement and sign cost (for neighborhood activities & events)

  * Annual Block Party

  * Annual Christmas Party

  * New members Gift Bag

  * Legal representation as necessary specific to CNA protecting and maintaining our neighborhood and or community interests.

  * Median Maintenance & beautification (grass, shrubs, tress, plants, palms, benches, lighting, library)

  * Purchase of benches/signs/garbage cans for medians


  ## You can now send your membership renewal with [Zelle(c)](https://www.zellepay.com/how-it-works)


  Zelle is an online person-to-person, person-to-business payment service. Your bank likely already supports Zelle from your banking dashboard. For example, at Chase, you can login and go to your Pay & Transfer menu entry and select Payment Center. You should see a screen like [Chase dashboard for Zelle](http://localhost:4000/images/zelle-at-chase.png). From there you can enroll in Zelle and add a new recipient of cornwallisna@gmail.com. Your payment via Zelle will automatically send a notification to the board along with your membership contribution to the CNA account. You can also download the [Getting started with Zelle](https://www.zellepay.com/go/zelle) app for your iPhone or Android device.


