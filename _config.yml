# Site wide configuration

title: CNA
description: "Cornwallis Neighborhood Association"
logo: 120x120.gif
teaser: 400x250.gif
locale: en_US
#url: "https://cornwallisna.github.io/cw_website/index.html"
url: "https://cornwallisna.org/index.html"
# Use 'bundle exec jekyll serve --host 192.168.1.xxx --baseurl ""' to serve locally
#baseurl: "https://cornwallisna.github.io/cw_website"
baseurl: ""


timezone: America/New_York

github_url: "https://github.com/cornwallisna/cw_website/"

# Jekyll configuration

sass:
  sass_dir: _sass
  style: compressed
permalink: /articles/:title/
kramdown:
  toc_levels: 1..2
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-gist

defaults:
  -
    scope:
      path: "aboutus.md"
    values:
      layout: "aboutus"
      permalink: "/aboutus.html"
      sponsors: "bottom"
      background: "help.png"
      image:
        feature_width: "100%"
      flexslider:
        slideshowSpeed: 7000
